name: Make TWRP Device

on:
  workflow_dispatch:
    inputs:
      IMG_URL:    
        description: 'IMG_URL'
        required: true
        default: ''

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Prepare the environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cpio wget zip aria2

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install twrpdtgen
        mkdir -p dt
      
    - name: Download boot or recovery img
      run: |
        aria2c "${{ github.event.inputs.IMG_URL }}"
        echo "Contents of workspace after download:"
        ls -la
        # find the first .img file downloaded
        IMG_FILE=$(ls -1 *.img 2>/dev/null | head -n1 || true)
        if [ -z "$IMG_FILE" ]; then
          echo "No .img file found in the workspace after download."
          exit 1
        fi
        echo "Using image: $IMG_FILE"
      
    - name: Start build
      run: |
        # use the discovered image file (first .img found)
        IMG_FILE=$(ls -1 *.img 2>/dev/null | head -n1)
        echo "Running twrpdtgen on: $IMG_FILE"
        python -m twrpdtgen -o dt "$IMG_FILE"

    - name: ZIP device tree
      run: |
        zip -r DeviceTree.zip ./dt

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./DeviceTree.zip
        name: TWRP_Device_Tree-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: DeviceTree for twrp
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
